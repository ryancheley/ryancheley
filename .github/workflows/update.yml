name: Daily Update
on:
  push:
  schedule:
    - cron: "45 8 * * *"
permissions: {}
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get source
        # ponytail: credentials must persist so git-auto-commit-action can push README.md
        # zizmor: ignore[artipacked]
        uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Update README.md
        run: uv run python build-readme.py
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v7.2.0
        with:
          commit_message: Update README.md
          file_pattern: README.md
